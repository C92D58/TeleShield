name: SwiftUI desktop builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  native-source-check:
    name: Native source checks
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assert native-only source tree
        shell: bash
        run: |
          if rg --files -g '*.py' -g 'requirements*.txt' -g '*PySide*' -g '*Telethon*' -g '*sidecar*' -g '*tesseract*' . | grep -q .; then
            echo "Legacy Python/PySide6/Telethon/sidecar artifacts remain in the source tree" >&2
            exit 1
          fi
          if rg -n -i "pyside6|telethon|sidecar|json-rpc|json_rpc" . \
            --glob '!swiftui/.build/**' \
            --glob '!dist/**' \
            --glob '!Package.resolved' \
            --glob '!.github/**' \
            --glob '!.git/**'; then
            echo "Legacy desktop/sidecar references remain in source files" >&2
            exit 1
          fi

      - name: Resolve Swift package
        run: swift package resolve --package-path swiftui

      - name: Check patch formatting
        run: git diff --check

  macos-swiftui:
    name: Test and build ${{ matrix.artifact_name }}
    needs: native-source-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            expected_arch: x86_64
            artifact_name: macOS-intel-swiftui
            file_name: macOS-intel-swiftui.dmg
          - runner: macos-14
            expected_arch: arm64
            artifact_name: macOS-arm-swiftui
            file_name: macOS-arm-swiftui.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report runner and Apple toolchain
        run: |
          sw_vers
          uname -a
          xcodebuild -version
          xcode-select -p
          xcrun --find xctest

      - name: Assert runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          actual_arch="$(uname -m)"
          echo "Runner architecture: $actual_arch"
          test "$actual_arch" = "$EXPECTED_ARCH"

      - name: Resolve Swift package
        run: swift package resolve --package-path swiftui

      - name: Run XCTest suite
        shell: bash
        run: |
          set -o pipefail
          swift test \
            --package-path swiftui \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors \
            2>&1 | tee "${RUNNER_TEMP}/swift-test-${{ matrix.artifact_name }}.log"

      - name: Build Release app bundle
        id: build-app
        if: ${{ always() }}
        run: scripts/build_swiftui_macos.sh

      - name: Verify executable architecture and app metadata
        id: verify-app
        if: ${{ always() }}
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          executable="dist/TeleShieldSwiftUI.app/Contents/MacOS/TeleShieldApp"
          architectures="$(lipo -archs "$executable")"
          echo "App architectures: $architectures"
          test "$architectures" = "$EXPECTED_ARCH"
          plutil -lint dist/TeleShieldSwiftUI.app/Contents/Info.plist
          file "$executable"
          du -sh dist/TeleShieldSwiftUI.app

      - name: Zip app for manual testing
        if: ${{ always() }}
        run: |
          if [ ! -d dist/TeleShieldSwiftUI.app ]; then
            echo "App bundle is unavailable; preserving the XCTest log only."
            exit 0
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            dist/TeleShieldSwiftUI.app \
            "dist/${{ matrix.artifact_name }}.app.zip"

      - name: Create unsigned DMG
        if: ${{ always() }}
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          if [ ! -d dist/TeleShieldSwiftUI.app ]; then
            echo "App bundle is unavailable; skipping DMG creation."
            exit 0
          fi
          mkdir -p dist/dmg-root
          cp -R dist/TeleShieldSwiftUI.app dist/dmg-root/TeleShield.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "TeleShield $ARTIFACT_NAME" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            "dist/${{ matrix.file_name }}"

      - name: Upload app, DMG, and XCTest log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.file_name }}
            dist/${{ matrix.artifact_name }}.app.zip
            ${{ runner.temp }}/swift-test-${{ matrix.artifact_name }}.log
          if-no-files-found: warn
          retention-days: 14
